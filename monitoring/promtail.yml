server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: edupay-json
    static_configs:
      - targets: [localhost]
        labels:
          app: edupay-ci
          job: edupay-ci
          __path__: /var/log/edupay/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            service: service
      - labels:
          level:
          service:
